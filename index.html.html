<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>國語生字練習簿</title>
<style>
:root{--bg:#f3efe6;--panel:#faf7f0;--ink:#1d1b18;--mute:#7a7266;--line:#d9d1c1;--red:#b3261e;--blue:#1d4f8f;--grid:#c9a79f;--guide:rgba(29,27,24,.16);--ok:#2f6b4a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17150f;--panel:#201d16;--ink:#f1ebdd;--mute:#a39a89;--line:#3a3529;--red:#ef7b72;--blue:#7fb0ee;--grid:#6b4a44;--guide:rgba(241,235,221,.2);--ok:#7cc79a}}
:root[data-theme="dark"]{--bg:#17150f;--panel:#201d16;--ink:#f1ebdd;--mute:#a39a89;--line:#3a3529;--red:#ef7b72;--blue:#7fb0ee;--grid:#6b4a44;--guide:rgba(241,235,221,.2);--ok:#7cc79a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-user-select:none;user-select:none}
.app{display:grid;grid-template-columns:280px 1fr;height:100vh;height:100dvh}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.hd{padding:16px 16px 8px}
h1{font-size:20px;margin:0 0 10px;font-family:"Kaiti TC","BiauKai","DFKai-SB","標楷體",serif;letter-spacing:.1em}
.row{display:flex;gap:8px;flex-wrap:wrap}
button,select,input,textarea{font:inherit;color:var(--ink)}
button{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer}
button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button.pri{background:var(--red);color:#fff;border-color:var(--red)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.chips{display:flex;gap:6px;padding:4px 16px 10px;overflow-x:auto}
.chips button{min-height:36px;padding:4px 12px;white-space:nowrap}
#list{flex:1;overflow:auto;padding:0 10px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px;align-content:start}
.it{position:relative;border:1px solid var(--line);border-radius:8px;background:var(--bg);text-align:center;padding:6px 2px;cursor:pointer;min-height:84px}
.it.sel{border:2px solid var(--red);padding:5px 1px}
.it b{display:block;font:400 34px/1.2 "Kaiti TC","BiauKai","DFKai-SB","標楷體",serif}
.it small{display:block;font-size:11px;color:var(--mute);min-height:14px}
.it i{position:absolute;top:2px;right:5px;font-style:normal;font-size:11px;color:var(--ok)}
main{display:flex;flex-direction:column;align-items:center;padding:14px;gap:12px;min-width:0;overflow:auto}
.info{text-align:center;min-height:56px}
.zy{font-size:22px;color:var(--red);letter-spacing:.15em}
.wd{color:var(--ink);font:400 30px/1.4 "Kaiti TC","BiauKai","DFKai-SB","標楷體",serif;letter-spacing:.12em}.wd small{font:13px "PingFang TC",sans-serif;color:var(--mute);margin-left:12px;letter-spacing:0}
.box{container-type:inline-size;position:relative;width:min(100%,calc(100dvh - 230px),620px);aspect-ratio:1;background:var(--panel);border:2px solid var(--grid)}
.box svg{position:absolute;inset:0;width:100%;height:100%}
.box svg line{stroke:var(--grid);stroke-width:1;stroke-dasharray:6 5}
.gc{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:400 78cqw/1 "Kaiti TC","BiauKai","DFKai-SB","標楷體",serif;color:var(--guide);pointer-events:none}
.gc.off{visibility:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.dot{width:44px;padding:0;position:relative}
.dot::after{content:"";position:absolute;inset:12px;border-radius:50%;background:var(--c)}
.dot.on{outline:3px solid var(--ink);outline-offset:1px}
.empty{color:var(--mute);text-align:center;margin:auto;line-height:2}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:14px;width:min(92vw,460px);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.45)}
label{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
input,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;-webkit-user-select:text;user-select:text}
textarea{min-height:110px;font-size:14px}
.msg{font-size:13px;color:var(--ok);min-height:18px;margin-top:6px}
#qz{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column;align-items:center;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px));overflow:auto}#qz.on{display:flex}.qs{width:min(100%,460px);margin:auto 0}.qs select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}.qs h2{font-size:22px;margin:0 0 8px}.qh{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:900px}.qrow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:auto 0;--s:clamp(110px,24vw,210px)}.qc{display:flex;flex-direction:column;align-items:center}.qy{height:38px;font-size:24px;color:var(--red);letter-spacing:.1em}.qb{position:relative;width:var(--s);aspect-ratio:1;background:var(--panel);border:2px solid var(--grid)}.qt{width:calc(var(--s)*.7);aspect-ratio:1;display:flex;align-items:center;justify-content:center;font:400 calc(var(--s)*.55)/1 'Kaiti TC','BiauKai','DFKai-SB','標楷體',serif}.qb svg{position:absolute;inset:0;width:100%;height:100%}.qb svg line{stroke:var(--grid);stroke-width:1;stroke-dasharray:6 5}.qa{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font:400 calc(var(--s)*.78)/1 'Kaiti TC','BiauKai','DFKai-SB','標楷體',serif;color:var(--red);opacity:.4;pointer-events:none}.rev .qa{display:flex}
.card{width:min(100%,640px);font-size:15px;line-height:1.7;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:6px 0}.card:empty{display:none}.card>div{margin:2px 0}.card .cc{font:30px 'Kaiti TC','BiauKai',serif;color:var(--red)}.card .me{color:var(--red);font-weight:600}.card .gp{color:var(--mute)}
@media (max-width:760px){.app{grid-template-columns:1fr;grid-template-rows:auto 1fr}aside{border-right:0;border-bottom:1px solid var(--line);max-height:34dvh}.box{width:min(100%,calc(100dvh - 520px),620px);min-width:260px}}
</style>
</head>
<body>
<div class="app">
<aside>
 <div class="hd"><h1>國語生字練習簿</h1>
  <div class="row"><button class="pri" id="add">＋ 新增生字</button><button class="on" id="qOpen">✎ 測驗</button><button id="bk">備份</button></div></div>
 <div class="chips" id="chips"></div>
 <div id="list"></div>
</aside>
<main id="main"></main>
</div>

<div id="qz"></div>
<dialog id="dAdd"><form method="dialog" onsubmit="return false">
 <h2 style="margin:0 0 4px;font-size:18px">新增生字</h2>
 <label>詞語（每行一個，要練習的字後面加 {注音}）</label><textarea id="fCh" placeholder="學{ㄒㄩㄝˊ}習&#10;國{ㄍㄨㄛˊ}語"></textarea><p style="font-size:13px;color:var(--mute);margin:6px 0 0">沒加 { } 時，詞語裡每個字都會變成生字。</p>
 
 
 <label>課別（可不填）</label><input id="fLs" placeholder="第一課" list="lsList"><datalist id="lsList"></datalist>
 <div class="msg" id="aMsg"></div>
 <div class="row" style="margin-top:8px"><button class="pri" id="aOk" type="button">加入</button><button id="aX" type="button">完成</button></div>
</form></dialog>

<dialog id="dBk">
 <h2 style="margin:0 0 4px;font-size:18px">備份與還原</h2>
 <p style="font-size:14px;color:var(--mute);margin:4px 0">資料存在這個瀏覽器裡。換裝置或清除資料前，請先複製備份。</p>
 <textarea id="bkT" placeholder="貼上備份內容後按「還原」"></textarea>
 <div class="msg" id="bMsg"></div>
 <div class="row"><button id="bC">複製備份</button><button id="bR">還原</button><button id="bX">關閉</button></div>
</dialog>

<script>
const KEY='zisheng-v2';let showSel=-1;
const PRE={'第一課':`蚊{ㄨㄣˊ}帳{ㄓㄤˋ}
亞洲{ㄓㄡ}
瘧{ㄋㄩㄝˋ}疾{ㄐㄧˊ}
死{ㄙˇ}亡
蚊子叮{ㄉㄧㄥ}
存{ㄘㄨㄣˊ}款
募{ㄇㄨˋ}集{ㄐㄧˊ}
寄{ㄐㄧˋ}信
贈{ㄗㄥˋ}品
獎{ㄐㄧㄤˇ}狀{ㄓㄨㄤˋ}
收藏{ㄘㄤˊ}
雜誌{ㄓˋ}
基{ㄐㄧ}金
全力以赴{ㄈㄨˋ}`,
'第二課':`德{ㄉㄜˊ}國
在乎{ㄏㄨ}
流血{ㄒㄧㄝˇ}
攝{ㄕㄜˋ}影
颱{ㄊㄞˊ}風
錄{ㄌㄨˋ}影
哀{ㄞ}求
山巒{ㄌㄨㄢˊ}
縱{ㄗㄨㄥˋ}橫
肚臍{ㄑㄧˊ}
禍{ㄏㄨㄛˋ}害
殘{ㄘㄢˊ}廢
檳{ㄅㄧㄣ}榔{ㄌㄤˊ}
降{ㄐㄧㄤˋ}落
鏟{ㄔㄢˇ}子
汙{ㄨ}水
切斷{ㄉㄨㄢˋ}`,
'第三課':`陡峭{ㄑㄧㄠˋ}
強勁{ㄐㄧㄥˋ}
高聳{ㄙㄨㄥˇ}
飢{ㄐㄧ}餓
隱{ㄧㄣˇ}密
拉扯{ㄔㄜˇ}
銳{ㄖㄨㄟˋ}利
弓箭{ㄐㄧㄢˋ}
韌{ㄖㄣˋ}性
虯{ㄑㄧㄡˊ}鬚客
鬍鬚{ㄒㄩ}
茂{ㄇㄠˋ}密
停止{ㄓˇ}
藤蔓{ㄇㄢˋ}
藉{ㄐㄧㄝˋ}由
豐{ㄈㄥ}富
挫{ㄘㄨㄛˋ}折{ㄓㄜˊ}`,
'第四課':`恆{ㄏㄥˊ}久
澄{ㄔㄥˊ}清
稻穗{ㄙㄨㄟˋ}
認養{ㄧㄤˇ}
水源{ㄩㄢˊ}
才藝{ㄧˋ}
樸{ㄆㄨˇ}素
土堆{ㄉㄨㄟ}
撿{ㄐㄧㄢˇ}垃圾
毛巾{ㄐㄧㄣ}
痠{ㄙㄨㄢ}痛
元素{ㄙㄨˋ}
尊{ㄗㄨㄣ}嚴{ㄧㄢˊ}
任勞{ㄌㄠˊ}任怨{ㄩㄢˋ}
慷{ㄎㄤ}慨{ㄎㄞˇ}
滋{ㄗ}味`,
'第五課':`商譽{ㄩˋ}
服務{ㄨˋ}
聯{ㄌㄧㄢˊ}合
核{ㄏㄜˊ}準
申{ㄕㄣ}請
警察局{ㄐㄩˊ}
松{ㄙㄨㄥ}樹
註{ㄓㄨˋ}冊{ㄘㄜˋ}
企{ㄑㄧˋ}業
毅{ㄧˋ}力
歷{ㄌㄧˋ}史
英{ㄧㄥ}雄
銷{ㄒㄧㄠ}售{ㄕㄡˋ}
勝{ㄕㄥˋ}利
霸{ㄅㄚˋ}主
項{ㄒㄧㄤˋ}目`,
'第六課':`娛{ㄩˊ}樂
汽{ㄑㄧˋ}水
吹口哨{ㄕㄠˋ}
典{ㄉㄧㄢˇ}禮
相框{ㄎㄨㄤ}
戲劇{ㄐㄩˋ}
父{ㄈㄨˋ}親
責{ㄗㄜˊ}任
判{ㄆㄢˋ}決
共鳴{ㄇㄧㄥˊ}
新穎{ㄧㄥˇ}
獲{ㄏㄨㄛˋ}得
最佳{ㄐㄧㄚ}
油膩{ㄋㄧˋ}
效{ㄒㄧㄠˋ}果
隊{ㄉㄨㄟˋ}伍
收益{ㄧˋ}
容貌{ㄇㄠˋ}
軍官{ㄍㄨㄢ}
增{ㄗㄥ}加`};
const preset=()=>Object.entries(PRE).flatMap(([l,t])=>parseWords(t,l));
function parseWords(txt,ls){const out=[];for(const line of txt.split('\n')){const w=line.trim();if(!w)continue;let plain='',tg=[],m;const re=/(\p{Script=Han})(?:\{([^}]*)\})?/gu;while((m=re.exec(w))){const i=[...plain].length;plain+=m[1];if(m[2]!==undefined)tg.push([i,m[1],m[2].trim()])}if(!plain)continue;if(!tg.length)tg=[...plain].map((c,i)=>[i,c,'']);for(const [k,ch,zy] of tg)out.push({ch,zy,wd:plain,k,ls,n:0})}return out}
let S={items:[],sel:0,lesson:'',guide:true,color:'ink',w:2,penOnly:false};
try{const r=localStorage.getItem(KEY);if(r)Object.assign(S,JSON.parse(r));else{S.items=preset();const o=JSON.parse(localStorage.getItem('zisheng-v1')||'{}');if(o.items)S.items.push(...o.items.filter(x=>x.ls!=='範例'))}}catch(e){if(!S.items.length)S.items=preset()}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let strokes=[],cur=null,cv,ctx;

function vis(){return S.items.map((x,i)=>({x,i})).filter(o=>!S.lesson||o.x.ls===S.lesson)}
function renderSide(){
 const ls=[...new Set(S.items.map(x=>x.ls).filter(Boolean))];
 $('chips').innerHTML=['',...ls].map(l=>`<button class="${S.lesson===l?'on':''}" data-l="${esc(l)}">${l?esc(l):'全部'}</button>`).join('');
 $('lsList').innerHTML=ls.map(l=>`<option value="${esc(l)}">`).join('');
 $('list').innerHTML=vis().map(o=>`<div class="it ${o.i===S.sel?'sel':''}" data-i="${o.i}"><b>${esc(o.x.ch)}</b><small>${esc(o.x.zy||'')}</small>${o.x.n?`<i>✓${o.x.n}</i>`:''}${o.x.w?'<i style="left:5px;right:auto;color:var(--red)">✗</i>':''}</div>`).join('')||'<div class="empty" style="grid-column:1/-1">這個課別還沒有生字</div>';
}
function renderMain(){
 const m=$('main'),it=S.items[S.sel];
 if(!it){m.innerHTML='<div class="empty">還沒有生字<br>按左上角「＋ 新增生字」開始</div>';return}
 const cols={ink:'var(--ink)',red:'var(--red)',blue:'var(--blue)'};
 m.innerHTML=`<div class="info"><div class="zy">${esc(it.zy||'')}</div><div class="wd">${wdHtml(it)}${it.n?`<small>已練習 ${it.n} 次</small>`:''}</div></div>
 <div class="box"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><line x1="0" y1="0" x2="100" y2="100"/><line x1="100" y1="0" x2="0" y2="100"/><line x1="50" y1="0" x2="50" y2="100"/><line x1="0" y1="50" x2="100" y2="50"/></svg>
 <div class="gc ${S.guide||showSel===S.sel?'':'off'}">${esc(it.ch)}</div><canvas id="cv"></canvas></div>
 <div class="tools">
  <button id="pv">◀ 上一字</button><button id="un">↶ 復原</button><button id="cl">清除</button>
  <button id="gd" class="${S.guide?'on':''}">描紅</button>${S.guide?'':'<button id="sh">看答案</button>'}<button id="po" class="${S.penOnly?'on':''}">只用筆</button>
  <button id="ok" class="pri">完成 ✓</button><button id="nx">下一字 ▶</button></div>
 <div class="tools">
  ${Object.keys(cols).map(k=>`<button class="dot ${S.color===k?'on':''}" data-c="${k}" style="--c:${cols[k]}" aria-label="${k}"></button>`).join('')}
  ${[1,2,3].map(w=>`<button data-w="${w}" class="${S.w===w?'on':''}">${['細','中','粗'][w-1]}</button>`).join('')}
  <button id="rm">刪除此字</button></div><div class="card">${(S.guide||showSel===S.sel)?card(it.ch,it.wd):''}</div>`;
 cv=$('cv');ctx=cv.getContext('2d');
 new ResizeObserver(fit).observe(cv);fit();bindCanvas();
}
function fit(){const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);draw()}
function inkColor(){return {ink:getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||'#000',red:getComputedStyle(document.documentElement).getPropertyValue('--red').trim(),blue:getComputedStyle(document.documentElement).getPropertyValue('--blue').trim()}[S.color]}
function draw(){
 if(!ctx)return;const W=cv.width,H=cv.height;ctx.clearRect(0,0,W,H);
 ctx.strokeStyle=ctx.fillStyle=inkColor();ctx.lineCap=ctx.lineJoin='round';
 const base=W*0.012*S.w+W*0.006;
 for(const s of strokes){
  if(s.length===1){ctx.beginPath();ctx.arc(s[0].x*W,s[0].y*H,base*.6,0,7);ctx.fill();continue}
  for(let i=1;i<s.length;i++){ctx.lineWidth=base*(0.55+s[i].p*0.9);ctx.beginPath();ctx.moveTo(s[i-1].x*W,s[i-1].y*H);ctx.lineTo(s[i].x*W,s[i].y*H);ctx.stroke()}
 }
}
function bindCanvas(){
 const pt=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height,p:e.pointerType==='pen'?(e.pressure||.5):.5}};
 cv.onpointerdown=e=>{if(S.penOnly&&e.pointerType==='touch')return;e.preventDefault();cv.setPointerCapture(e.pointerId);cur=[pt(e)];strokes.push(cur);draw()};
 cv.onpointermove=e=>{if(!cur)return;const ev=e.getCoalescedEvents?e.getCoalescedEvents():[e];for(const c of(ev.length?ev:[e]))cur.push(pt(c));draw()};
 cv.onpointerup=cv.onpointercancel=()=>{cur=null};
}
function wdHtml(it){const w=[...(it.wd||'')],rev=S.guide||showSel===S.sel;if(w.length<2)return rev?esc(it.wd||''):'';return w.map((c,i)=>i===it.k?`<span style="color:var(--red)">${rev?esc(c):'＿'}</span>`:esc(c)).join('')}
function go(d){const v=vis();if(!v.length)return;let k=v.findIndex(o=>o.i===S.sel);k=(k+d+v.length)%v.length;S.sel=v[k].i;strokes=[];save();renderSide();renderMain()}

document.addEventListener('click',e=>{
 const t=e.target.closest('button,.it');if(!t)return;
 if(t.classList.contains('it')){S.sel=+t.dataset.i;strokes=[];save();renderSide();renderMain();return}
 if(t.dataset.l!==undefined&&t.closest('#chips')){S.lesson=t.dataset.l;const v=vis();if(v.length&&!v.some(o=>o.i===S.sel))S.sel=v[0].i;strokes=[];save();renderSide();renderMain();return}
 if(t.dataset.c){S.color=t.dataset.c;save();renderMain();return}
 if(t.dataset.w){S.w=+t.dataset.w;save();renderMain();return}
 switch(t.id){
  case 'pv':go(-1);break;case 'nx':go(1);break;
  case 'un':strokes.pop();draw();break;case 'cl':strokes=[];draw();break;
  case 'gd':S.guide=!S.guide;save();renderMain();break;case 'sh':showSel=S.sel;renderMain();break;
  case 'po':S.penOnly=!S.penOnly;save();renderMain();break;
  case 'ok':S.items[S.sel].n=(S.items[S.sel].n||0)+1;save();go(1);break;
  case 'rm':if(confirm('刪除「'+S.items[S.sel].ch+'」？')){S.items.splice(S.sel,1);S.sel=Math.max(0,Math.min(S.sel,S.items.length-1));strokes=[];save();renderSide();renderMain()}break;
  case 'add':$('aMsg').textContent='';$('dAdd').showModal();setTimeout(()=>$('fCh').focus(),50);break;
  case 'aX':$('dAdd').close();break;
  case 'aOk':addItems();break;
  case 'bk':$('bkT').value='';$('bMsg').textContent='';$('dBk').showModal();break;
  case 'bX':$('dBk').close();break;

const Z=$('qz');let Q={};
const GRID='<svg viewBox="0 0 100 100" preserveAspectRatio="none"><line x1="0" y1="0" x2="100" y2="100"/><line x1="100" y1="0" x2="0" y2="100"/><line x1="50" y1="0" x2="50" y2="100"/><line x1="0" y1="50" x2="100" y2="50"/></svg>';
function groups(items){const m=new Map();for(const it of items){const wd=it.wd||it.ch;let k=it.k??wd.indexOf(it.ch);if(k<0)k=0;const key=(it.ls||'')+'|'+wd;if(!m.has(key))m.set(key,{wd,ls:it.ls,t:[],its:[]});const g=m.get(key);g.t.push({k,ch:it.ch,zy:it.zy});g.its.push(it)}return[...m.values()]}
function pad(box){const c=box.querySelector('canvas'),x=c.getContext('2d'),st=[];let cu=null;
 const dr=()=>{x.clearRect(0,0,c.width,c.height);x.strokeStyle=x.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim();x.lineCap=x.lineJoin='round';const W=c.width,H=c.height,b=W*0.03;for(const s of st){if(s.length<2){x.beginPath();x.arc(s[0].x*W,s[0].y*H,b*.6,0,7);x.fill();continue}for(let i=1;i<s.length;i++){x.lineWidth=b*(.55+s[i].p*.9);x.beginPath();x.moveTo(s[i-1].x*W,s[i-1].y*H);x.lineTo(s[i].x*W,s[i].y*H);x.stroke()}}};
 const fit=()=>{const r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);dr()};
 const pt=e=>{const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height,p:e.pointerType==='pen'?(e.pressure||.5):.5}};
 const api={undo(){st.pop();dr()},clear(){st.length=0;dr()}};
 c.onpointerdown=e=>{if(S.penOnly&&e.pointerType==='touch')return;e.preventDefault();c.setPointerCapture(e.pointerId);cu=[pt(e)];st.push(cu);Q.last=api;dr()};
 c.onpointermove=e=>{if(!cu)return;cu.push(pt(e));dr()};
 c.onpointerup=c.onpointercancel=()=>{cu=null};
 new ResizeObserver(fit).observe(c);return api}
function qSetup(msg){const ls=[...new Set(S.items.map(x=>x.ls).filter(Boolean))],bad=S.items.filter(x=>x.w>0).length;
 Z.innerHTML=`<div class='qs'><h2>開始測驗</h2><label>範圍</label><select id='qR'><option value=''>全部</option>${ls.map(l=>`<option value='${esc(l)}'>${esc(l)}</option>`).join('')}${bad?`<option value='#bad'>錯題本（${bad}）</option>`:''}</select><label>題數</label><select id='qN'><option value='10'>10 題</option><option value='20'>20 題</option><option value='0'>全部</option></select><label>順序</label><select id='qO'><option value='r'>隨機</option><option value='s'>依序</option></select><div class='msg' style='color:var(--red)'>${msg||''}</div><div class='row' style='margin-top:12px'><button class='pri' id='qGo'>開始</button><button id='qX'>取消</button></div></div>`;Z.classList.add('on')}
function qStart(list){Q={list,i:0,res:[],last:null};qShow()}
function qShow(){const g=Q.list[Q.i],tk=new Map(g.t.map(t=>[t.k,t]));
 const cells=[...g.wd].map((c,i)=>tk.has(i)?`<div class='qc'><div class='qy'>${esc(tk.get(i).zy||'')}</div><div class='qb'>${GRID}<div class='qa'>${esc(c)}</div><canvas></canvas></div></div>`:`<div class='qc'><div class='qy'></div><div class='qt'>${esc(c)}</div></div>`).join('');
 Z.innerHTML=`<div class='qh'><span>第 ${Q.i+1} / ${Q.list.length} 題　<small style='color:var(--mute)'>${esc(g.ls||'')}</small></span><button id='qX'>結束</button></div><div class='qrow' id='qRow'>${cells}</div><div class='tools' id='qBt'><button id='qU'>↶ 復原</button><button id='qC'>清除</button><button id='qP' class='${S.penOnly?'on':''}'>只用筆</button><button class='pri' id='qA'>對答案</button></div>`;
 Q.pads=[...Z.querySelectorAll('.qb')].map(pad);Q.last=null;Z.classList.add('on')}
function qMark(ok){const g=Q.list[Q.i];for(const it of g.its){if(ok){if(it.w>0)it.w--;it.n=(it.n||0)+1}else it.w=(it.w||0)+1}save();Q.res.push(ok);Q.i++;Q.i>=Q.list.length?qEnd():qShow()}
function qEnd(){const ok=Q.res.filter(Boolean).length,n=Q.list.length;Q.bad=Q.list.filter((g,i)=>!Q.res[i]);renderSide();
 Z.innerHTML=`<div class='qs' style='text-align:center'><h2>測驗結果</h2><div style='font-size:52px;color:var(--red)'>${ok} / ${n}</div>${Q.bad.length?`<label>答錯的詞語（已加入錯題本）</label><div class='wd'>${Q.bad.map(g=>esc(g.wd)).join('　')}</div>`:'<p>全部答對，太棒了！</p>'}<div class='row' style='margin-top:16px;justify-content:center'>${Q.bad.length?`<button class='pri' id='qRe'>重考錯題</button>`:''}<button id='qX'>回到練習</button></div></div>`}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!b.id||b.id[0]!=='q')return;
 switch(b.id){
  case 'qOpen':qSetup();break;
  case 'qX':Z.classList.remove('on');renderSide();break;
  case 'qGo':{const r=$('qR').value;let gs=groups(S.items.filter(x=>!r||(r==='#bad'?x.w>0:x.ls===r)));if(!gs.length){qSetup('這個範圍沒有題目');break}if($('qO').value==='r')gs.sort(()=>Math.random()-.5);const n=+$('qN').value;if(n)gs=gs.slice(0,n);qStart(gs);break}
  case 'qU':if(Q.last)Q.last.undo();break;
  case 'qC':Q.pads.forEach(p=>p.clear());break;
  case 'qP':S.penOnly=!S.penOnly;save();b.classList.toggle('on',S.penOnly);break;
  case 'qA':$('qRow').classList.add('rev');$('qRow').insertAdjacentHTML('afterend',`<div class='card'>${Q.list[Q.i].t.map((t,j)=>card(t.ch,j?'':Q.list[Q.i].wd)).join('')}</div>`);$('qBt').innerHTML=`<button id='qW'>✗ 答錯</button><button class='pri' id='qY'>✓ 答對</button>`;break;
  case 'qW':qMark(false);break;case 'qY':qMark(true);break;
  case 'qRe':qStart(Q.bad);break;
 }});
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',draw);
if(S.sel>=S.items.length)S.sel=0;
renderSide();renderMain();
</script>
</body>
</html>
